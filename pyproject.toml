[project]
name = "support-sim-bench"
version = "0.1.0"
description = "Small multi-turn benchmark for food-delivery support agents, with a simulated customer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
]

[project.scripts]
supportsim = "supportsim.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "supportsim"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
